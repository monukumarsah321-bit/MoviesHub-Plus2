<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PLUS2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0b;
            color: white;
        }

        header {
            background: #111;
            padding: 18px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff2b2b;
        }

        .search {
            width: 300px;
            padding: 11px 15px;
            border-radius: 25px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            outline: none;
        }

        .hero {
            padding: 70px 5%;
            background: linear-gradient(90deg, #000, #171717);
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #e50914;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .section {
            padding: 35px 5%;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
        }

        .card {
            background: #151515;
            border-radius: 8px;
            overflow: hidden;
            transition: 0.25s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .poster {
            width: 100%;
            height: 230px;
            background: linear-gradient(135deg, #222, #444);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .card h3 {
            padding: 12px;
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 30px;
            border-top: 1px solid #222;
            color: #777;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .search {
                width: 100%;
            }

            .hero h1 {
                font-size: 34px;
            }

            .movies {
                grid-template-columns: repeat(2, 1fr);
            }

            .poster {
                height: 210px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">PLUS2</div>

    <input
        class="search"
        type="text"
        placeholder="Search movies..."
        onkeyup="searchMovies()"
        id="searchBox"
    >
</header>

<section class="hero">
    <h1>Welcome to PLUS2</h1>
    <p>Discover movies and videos in one place.</p>
    <a href="#movies" class="btn">Explore Now</a>
</section>

<section class="section" id="movies">
    <h2>Latest Movies</h2>

    <div class="movies" id="movieList">

        <div class="card">
            <div class="poster">POSTER</div>
            <h3>Movie One</h3>
        </div>

        <div class="card">
            <div class="poster">POSTER</div>
            <h3>Movie Two</h3>
        </div>

        <div class="card">
            <div class="poster">POSTER</div>
            <h3>Movie Three</h3>
        </div>

        <div class="card">
            <div class="poster">POSTER</div>
            <h3>Movie Four</h3>
        </div>

        <div class="card">
            <div class="poster">POSTER</div>
            <h3>Movie Five</h3>
        </div>

        <div class="card">
            <div class="poster">POSTER</div>
            <h3>Movie Six</h3>
        </div>

    </div>
</section>

<footer>
    © 2026 PLUS2. All rights reserved.
</footer>

<script>
    function searchMovies() {
        const search =
            document.getElementById("searchBox").value.toLowerCase();

        const cards =
            document.querySelectorAll(".card");

        cards.forEach(card => {
            const title =
                card.querySelector("h3").textContent.toLowerCase();

            card.style.display =
                title.includes(search) ? "block" : "none";
        });
    }
</script>

</body>
</html>
