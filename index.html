<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUS2 — Movies & Videos</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(120,0,180,.18),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(180,0,30,.20),transparent 30%),
    #050505;
  color:#fff;
  min-height:100vh;
}

header{
  padding:20px;
  text-align:center;
  background:rgba(0,0,0,.75);
  border-bottom:1px solid rgba(150,40,255,.35);
  box-shadow:0 0 25px rgba(100,0,160,.18);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:4px;
  background:linear-gradient(90deg,#ff1744,#a020f0,#ff1744);
  -webkit-background-clip:text;
  color:transparent;
}

.tagline{
  color:#aaa;
  margin-top:5px;
}

.container{
  width:94%;
  max-width:1100px;
  margin:25px auto;
}

.admin{
  background:linear-gradient(145deg,#100b12,#090909);
  border:1px solid rgba(160,30,255,.35);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px rgba(100,0,150,.15);
  margin-bottom:30px;
}

.admin h2{
  margin-bottom:15px;
  color:#d79cff;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #3b164d;
  background:#090909;
  color:white;
  outline:none;
}

input:focus,select:focus{
  border-color:#a020f0;
  box-shadow:0 0 12px rgba(160,32,240,.25);
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  margin-top:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#b00030,#7b00b5);
  box-shadow:0 0 18px rgba(150,0,180,.25);
}

button:active{
  transform:scale(.96);
}

.section-title{
  margin:25px 0 15px;
  color:#fff;
  font-size:24px;
}

.movies{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:linear-gradient(145deg,#111,#080808);
  border:1px solid rgba(160,32,240,.25);
  border-radius:18px;
  padding:12px;
  overflow:hidden;
  transition:.25s;
  box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.card:hover{
  transform:translateY(-5px);
  border-color:#a020f0;
  box-shadow:
    0 0 20px rgba(160,32,240,.25),
    0 0 30px rgba(170,0,40,.15);
}

.poster{
  width:100%;
  height:250px;
  border-radius:13px;
  background:
    linear-gradient(135deg,#25002e,#150008);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  color:#aaa;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card h3{
  margin:12px 2px 5px;
  font-size:18px;
}

.rating{
  color:#ffd54a;
  font-size:14px;
  margin-bottom:8px;
}

.category{
  color:#bb72ff;
  font-size:13px;
  margin-bottom:10px;
}

.actions{
  display:flex;
  gap:8px;
}

.actions a{
  flex:1;
  text-align:center;
  text-decoration:none;
  color:white;
  padding:10px 5px;
  border-radius:10px;
  background:linear-gradient(90deg,#97002d,#68009c);
  font-size:14px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:35px 10px;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#777;
  margin-top:30px;
  border-top:1px solid #211326;
}

@media(max-width:500px){
  .logo{
    font-size:27px;
  }

  .movies{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .poster{
    height:220px;
  }

  .card h3{
    font-size:15px;
  }

  .actions a{
    font-size:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">PLUS2</div>
  <div class="tagline">Movies & Videos</div>
</header>

<div class="container">

  <section class="admin">
    <h2>➕ Add Movie</h2>

    <input id="movieName" type="text" placeholder="Movie name">

    <input id="movieLink" type="url" placeholder="Movie watch/download link">

    <input id="posterUrl" type="url" placeholder="Poster image URL">

    <input id="rating" type="number" min="0" max="10" step="0.1"
           placeholder="IMDb rating">

    <select id="category">
      <option value="Hollywood">Hollywood</option>
      <option value="Bollywood">Bollywood</option>
      <option value="South Indian">South Indian</option>
      <option value="Web Series">Web Series</option>
    </select>

    <button onclick="addMovie()">ADD MOVIE</button>
  </section>

  <h2 class="section-title">🎬 Movies</h2>

  <div id="movieList" class="movies"></div>

</div>

<footer>
  © 2026 PLUS2 — Movies & Videos
</footer>

<script>
let movies = JSON.parse(localStorage.getItem("plus2Movies")) || [];

function saveMovies(){
  localStorage.setItem("plus2Movies", JSON.stringify(movies));
}

function addMovie(){

  const name = document.getElementById("movieName").value.trim();
  const link = document.getElementById("movieLink").value.trim();
  const poster = document.getElementById("posterUrl").value.trim();
  const rating = document.getElementById("rating").value.trim();
  const category = document.getElementById("category").value;

  if(!name || !link){
    alert("Movie name aur movie link zaroor bharo.");
    return;
  }

  movies.unshift({
    id:Date.now(),
    name:name,
    link:link,
    poster:poster,
    rating:rating || "N/A",
    category:category
  });

  saveMovies();
  renderMovies();

  document.getElementById("movieName").value="";
  document.getElementById("movieLink").value="";
  document.getElementById("posterUrl").value="";
  document.getElementById("rating").value="";
}

function deleteMovie(id){
  if(confirm("Is movie ko delete karna hai?")){
    movies = movies.filter(movie => movie.id !== id);
    saveMovies();
    renderMovies();
  }
}

function renderMovies(){

  const list = document.getElementById("movieList");

  if(movies.length === 0){
    list.innerHTML =
      '<div class="empty">Abhi koi movie add nahi ki gayi.</div>';
    return;
  }

  list.innerHTML = movies.map(movie => {

    const posterHTML = movie.poster
      ? `<img src="${escapeHTML(movie.poster)}"
             alt="${escapeHTML(movie.name)}"
             onerror="this.style.display='none';">`
      : `<span>PLUS2<br>🎬</span>`;

    return `
      <article class="card">

        <div class="poster">
          ${posterHTML}
        </div>

        <h3>${escapeHTML(movie.name)}</h3>

        <div class="rating">
          ⭐ ${escapeHTML(movie.rating)}/10
        </div>

        <div class="category">
          ${escapeHTML(movie.category)}
        </div>

        <div class="actions">
          <a href="${escapeHTML(movie.link)}"
             target="_blank"
             rel="noopener">
             ▶ Watch
          </a>

          <a href="${escapeHTML(movie.link)}"
             target="_blank"
             rel="noopener">
             ↓ Download
          </a>
        </div>

        <button
          onclick="deleteMovie(${movie.id})"
          style="width:100%;background:#26000c;margin-top:8px;">
          Delete
        </button>

      </article>
    `;

  }).join("");
}

function escapeHTML(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

renderMovies();
</script>

</body>
  </html>
