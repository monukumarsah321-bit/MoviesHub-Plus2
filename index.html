<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLUS2 Movies</title>

<!-- Google AdSense -->
<script async
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4122483579384764"
crossorigin="anonymous"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#3b0715 0%,#120308 35%,#050505 75%);
  color:white;
  min-height:100vh;
}

header{
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid rgba(255,50,90,.25);
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
  color:#ff174f;
  text-shadow:0 0 18px rgba(255,23,79,.7);
}

.subtitle{
  margin-top:5px;
  color:#d9b7df;
  font-size:13px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px 14px 50px;
}

.ad-box{
  width:100%;
  min-height:90px;
  margin:10px 0 20px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#75656f;
  font-size:11px;
}

.admin{
  background:linear-gradient(145deg,#16070d,#090909);
  border:1px solid rgba(255,35,85,.35);
  border-radius:18px;
  padding:18px;
  box-shadow:0 0 30px rgba(255,0,70,.08);
  margin-bottom:25px;
}

.admin h2{
  color:#ff3767;
  margin-bottom:15px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #522033;
  background:#090909;
  color:white;
  outline:none;
}

input:focus,select:focus{
  border-color:#ff275c;
  box-shadow:0 0 10px rgba(255,39,92,.25);
}

button{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn{
  width:100%;
  margin-top:8px;
  background:linear-gradient(90deg,#b90038,#ff174f);
  color:white;
  box-shadow:0 0 18px rgba(255,23,79,.3);
}

.clear-btn{
  width:100%;
  margin-top:8px;
  background:#241019;
  color:#ff9db5;
  border:1px solid #522033;
}

.section-title{
  font-size:22px;
  margin:25px 0 14px;
  color:#eee;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}

.cat{
  flex:0 0 auto;
  background:#14070c;
  color:#d8b4dc;
  border:1px solid #4b1b2c;
  padding:9px 14px;
  border-radius:30px;
  font-size:13px;
}

.cat.active{
  background:#8f1238;
  color:white;
  border-color:#ff275c;
}

.movies{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:14px;
}

.card{
  background:linear-gradient(145deg,#17070d,#080808);
  border:1px solid rgba(255,40,90,.2);
  border-radius:15px;
  padding:12px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#ff285e;
  box-shadow:0 0 22px rgba(255,20,75,.18);
}

.card h3{
  font-size:16px;
  margin:5px 0 8px;
}

.rating{
  color:#e8c3eb;
  font-size:13px;
  margin-bottom:10px;
}

.category{
  display:inline-block;
  font-size:11px;
  color:#ff9db5;
  margin-bottom:10px;
}

.watch{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#a90d3d;
  color:white;
  padding:10px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#9f899e;
  padding:30px 10px;
}

.note{
  color:#927f91;
  font-size:11px;
  line-height:1.5;
  margin-top:10px;
}

footer{
  text-align:center;
  color:#766673;
  font-size:12px;
  padding:25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">PLUS2</div>
  <div class="subtitle">Movies • Videos • External Links</div>
</header>

<div class="container">

  <!-- AdSense area -->
  <div class="ad-box">
    <!-- Google Auto Ads can appear here automatically -->
  </div>

  <div class="admin">
    <h2>➕ Add Movie</h2>

    <input
      id="movieName"
      type="text"
      placeholder="Movie / Series Name">

    <input
      id="movieLink"
      type="url"
      placeholder="Other Website Link (https://...)">

    <input
      id="imdb"
      type="number"
      min="0"
      max="10"
      step="0.1"
      placeholder="IMDb Rating (optional)">

    <select id="category">
      <option value="Hollywood">Hollywood</option>
      <option value="Bollywood">Bollywood</option>
      <option value="South Indian">South Indian</option>
      <option value="Web Series">Web Series</option>
      <option value="Other">Other</option>
    </select>

    <button class="add-btn" onclick="addMovie()">
      ADD MOVIE
    </button>

    <button class="clear-btn" onclick="clearMovies()">
      CLEAR MY ADDED MOVIES
    </button>

    <div class="note">
      External links should point to websites/content you are
      authorized to share. Movies are not uploaded to this website.
    </div>
  </div>

  <h2 class="section-title">🎬 Categories</h2>

  <div class="categories">
    <button class="cat active"
      onclick="filterMovies('All',this)">
      All
    </button>

    <button class="cat"
      onclick="filterMovies('Hollywood',this)">
      Hollywood
    </button>

    <button class="cat"
      onclick="filterMovies('Bollywood',this)">
      Bollywood
    </button>

    <button class="cat"
      onclick="filterMovies('South Indian',this)">
      South Indian
    </button>

    <button class="cat"
      onclick="filterMovies('Web Series',this)">
      Web Series
    </button>

    <button class="cat"
      onclick="filterMovies('Other',this)">
      Other
    </button>
  </div>

  <h2 class="section-title">🍿 Movies</h2>

  <div id="movies" class="movies"></div>

  <!-- Second AdSense space -->
  <div class="ad-box">
    <!-- Google Auto Ads can appear here automatically -->
  </div>

</div>

<footer>
  © 2026 PLUS2 • External links belong to their respective websites.
</footer>

<script>

let movies =
  JSON.parse(localStorage.getItem("plus2_movies")) || [];

let currentFilter = "All";

function saveMovies(){
  localStorage.setItem(
    "plus2_movies",
    JSON.stringify(movies)
  );
}

function addMovie(){

  const name =
    document.getElementById("movieName").value.trim();

  const link =
    document.getElementById("movieLink").value.trim();

  const imdb =
    document.getElementById("imdb").value.trim();

  const category =
    document.getElementById("category").value;

  if(!name){
    alert("Movie name enter karo.");
    return;
  }

  if(!link){
    alert("External website link enter karo.");
    return;
  }

  try{

    const url = new URL(link);

    if(
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ){
      throw new Error();
    }

  }catch(e){

    alert(
      "Valid website link enter karo.\n\nExample:\nhttps://example.com"
    );

    return;
  }

  const movie = {
    id:Date.now(),
    name:name,
    link:link,
    imdb:imdb || "",
    category:category
  };

  movies.unshift(movie);

  saveMovies();

  document.getElementById("movieName").value = "";
  document.getElementById("movieLink").value = "";
  document.getElementById("imdb").value = "";

  renderMovies();

  alert("Movie added successfully!");
}

function renderMovies(){

  const box =
    document.getElementById("movies");

  let list = movies;

  if(currentFilter !== "All"){

    list = movies.filter(
      movie => movie.category === currentFilter
    );

  }

  if(list.length === 0){

    box.innerHTML =
      '<div class="empty">' +
      'Abhi koi movie add nahi hai.' +
      '</div>';

    return;
  }

  box.innerHTML = list.map(movie => `

    <div class="card">

      <span class="category">
        ${escapeHTML(movie.category)}
      </span>

      <h3>
        ${escapeHTML(movie.name)}
      </h3>

      ${
        movie.imdb
        ? `
          <div class="rating">
            ⭐ IMDb ${escapeHTML(movie.imdb)}/10
          </div>
        `
        : `
          <div class="rating">
            IMDb rating not added
          </div>
        `
      }

      <a
        class="watch"
        href="${safeURL(movie.link)}"
        target="_blank"
        rel="noopener noreferrer">

        🔗 WATCH / VISIT

      </a>

    </div>

  `).join("");
}

function filterMovies(category,button){

  currentFilter = category;

  document
    .querySelectorAll(".cat")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  renderMovies();
}

function clearMovies(){

  if(movies.length === 0){
    return;
  }

  if(
    confirm(
      "Apne browser me save ki hui movies delete karni hain?"
    )
  ){

    movies = [];

    saveMovies();

    renderMovies();
  }
}

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeURL(url){

  return String(url)
    .replace(/"/g,"%22")
    .replace(/</g,"%3C")
    .replace(/>/g,"%3E");
}

renderMovies();

</script>

</body>
  </html>
